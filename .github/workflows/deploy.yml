name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one concurrent deployment runs to production
concurrency:
  group: "pages"
  cancel-in-progress: false

# Least-privilege permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify custom domain (CNAME)
        run: |
          if [ ! -f "dist/CNAME" ]; then
            echo "::error::dist/CNAME missing from build output!"
            exit 1
          fi
          echo "Verified CNAME: $(cat dist/CNAME)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
